name: Fetch one YouTube transcript

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Fetch captions and metadata
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          mkdir -p transcripts
          cd transcripts
          yt-dlp --skip-download --write-sub --write-auto-sub \
            --sub-lang "en,en-orig,en-US,en-GB" --sub-format vtt \
            --print-to-file "title: %(title)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "channel: %(channel)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "upload_date: %(upload_date)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "duration: %(duration_string)s" "$VIDEO_ID.meta.txt" \
            -o "%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$VIDEO_ID"
          ls -la

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          git diff --staged --quiet || git commit -m "chore: fetch transcript for ${{ inputs.video_id }}"
          git push
