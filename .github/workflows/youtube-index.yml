name: Index new YouTube sermons

on:
  workflow_dispatch: {}

jobs:
  index:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    permissions:
      contents: write
    env:
      VIDEO_ID: QZ99-2aLMEQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install fetchers
        run: pip install -U yt-dlp youtube-transcript-api

      - name: Try yt-dlp
        continue-on-error: true
        run: |
          cd transcripts
          yt-dlp --skip-download --write-sub --write-auto-sub \
            --sub-lang "en,en-orig,en-US,en-GB" --sub-format vtt \
            --extractor-args "youtube:player_client=default,tv_simply,web_safari" \
            -o "%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$VIDEO_ID" || true
          ls -la

      - name: Try youtube-transcript-api
        continue-on-error: true
        run: |
          ls transcripts/$VIDEO_ID*.vtt 2>/dev/null && exit 0
          python - <<'EOF'
          import json, os
          from youtube_transcript_api import YouTubeTranscriptApi
          vid = os.environ["VIDEO_ID"]
          fetched = YouTubeTranscriptApi().fetch(vid, languages=["en", "en-US", "en-GB"])
          data = [{"start": s.start, "duration": s.duration, "text": s.text} for s in fetched]
          with open(f"transcripts/{vid}.transcript.json", "w") as f:
              json.dump(data, f)
          print(f"fetched {len(data)} segments")
          EOF

      - name: Try invidious instances
        continue-on-error: true
        run: |
          ls transcripts/$VIDEO_ID*.vtt transcripts/$VIDEO_ID*.json 2>/dev/null | grep -v oembed && exit 0
          for inst in inv.nadeko.net yewtu.be invidious.f5.si inv.tux.pizza invidious.privacyredirect.com iv.duti.dev invidious.materialio.us; do
            echo "== $inst"
            listing=$(curl -sS -m 20 "https://$inst/api/v1/captions/$VIDEO_ID" || true)
            echo "$listing" | head -c 400; echo
            if echo "$listing" | grep -q '"label"'; then
              curl -sS -m 30 "https://$inst/api/v1/captions/$VIDEO_ID?lang=en" -o "transcripts/$VIDEO_ID.en.vtt" || true
              if [ -s "transcripts/$VIDEO_ID.en.vtt" ] && head -1 "transcripts/$VIDEO_ID.en.vtt" | grep -q WEBVTT; then
                echo "got captions from $inst"; break
              else
                rm -f "transcripts/$VIDEO_ID.en.vtt"
              fi
            fi
          done
          ls -la transcripts/

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -m "chore: fetch transcript for $VIDEO_ID (attempt ${{ matrix.attempt }})"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 3; done
          exit 1
