name: Index new YouTube sermons

on:
  workflow_dispatch: {}

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VIDEO_ID: QZ99-2aLMEQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install fetchers
        run: pip install -U yt-dlp youtube-transcript-api

      - name: Fetch title via oembed
        continue-on-error: true
        run: |
          mkdir -p transcripts
          curl -sS "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$VIDEO_ID&format=json" \
            | tee "transcripts/$VIDEO_ID.oembed.json"
          echo

      - name: Fetch captions with yt-dlp
        continue-on-error: true
        run: |
          cd transcripts
          yt-dlp --skip-download --write-sub --write-auto-sub \
            --sub-lang "en,en-orig,en-US,en-GB" --sub-format vtt \
            --extractor-args "youtube:player_client=default,tv_simply,web_safari" \
            --print-to-file "title: %(title)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "channel: %(channel)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "upload_date: %(upload_date)s" "$VIDEO_ID.meta.txt" \
            --print-to-file "duration: %(duration_string)s" "$VIDEO_ID.meta.txt" \
            -o "%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$VIDEO_ID"
          ls -la

      - name: Fallback via youtube-transcript-api
        continue-on-error: true
        run: |
          ls transcripts/$VIDEO_ID*.vtt 2>/dev/null && exit 0
          python - <<'EOF'
          import json, os
          from youtube_transcript_api import YouTubeTranscriptApi
          vid = os.environ["VIDEO_ID"]
          fetched = YouTubeTranscriptApi().fetch(vid, languages=["en", "en-US", "en-GB"])
          data = [{"start": s.start, "duration": s.duration, "text": s.text} for s in fetched]
          with open(f"transcripts/{vid}.transcript.json", "w") as f:
              json.dump(data, f)
          print(f"fetched {len(data)} segments")
          EOF

      - name: Show results
        run: ls -la transcripts/ && head -c 2000 transcripts/* 2>/dev/null || true

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          git diff --staged --quiet || git commit -m "chore: fetch transcript for $VIDEO_ID"
          git push
